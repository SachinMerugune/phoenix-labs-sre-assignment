replicaCount: 1

api:
  image:
    repository: phoenix-api
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    nodePort: 30000
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

worker:
  image:
    repository: phoenix-worker
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3001
    nodePort: 30001
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgresql:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  dbName: payments_db
  user: postgres
  password: supersecretpassword
