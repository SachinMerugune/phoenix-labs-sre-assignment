apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresql.dbName | quote }}
  POSTGRES_USER: {{ .Values.postgresql.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgresql.user }}:{{ .Values.postgresql.password }}@postgres-service:5432/{{ .Values.postgresql.dbName }}"
