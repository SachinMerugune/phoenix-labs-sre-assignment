global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "payment-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: "payment-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3001"]
